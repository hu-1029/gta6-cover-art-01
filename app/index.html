<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Tide Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Neon Tide cover studio</h1>
  <div class="presets">
    <button type="button" data-preset="neon-tide" class="active">Neon Tide</button>
    <button type="button" data-preset="midnight-mile">Midnight Mile</button>
  </div>
</header>
<main class="workspace">
  <section class="stage">
    <canvas id="coverCanvas" width="1080" height="1080"></canvas>
    <p class="hint">Drag a photo to reframe it. Scroll on a photo to zoom. Click a photo to select it, then upload to replace it.</p>
  </section>
  <aside class="panel">
    <section>
      <h2>Layout</h2>
      <div class="btnrow" id="layoutBtns">
        <button type="button" data-layout="mosaic" class="active">Mosaic</button>
        <button type="button" data-layout="hero-four">Hero Four</button>
        <button type="button" data-layout="full-frame">Full Frame</button>
        <button type="button" data-layout="nine-grid">Nine Grid</button>
        <button type="button" data-layout="polaroids">Polaroids</button>
      </div>
    </section>
    <section>
      <h2>Colour grade</h2>
      <div class="btnrow" id="gradeBtns">
        <button type="button" data-grade="vice-pink" class="active">Vice Pink</button>
        <button type="button" data-grade="sunset">Sunset</button>
        <button type="button" data-grade="neon-night">Neon Night</button>
        <button type="button" data-grade="golden-hour">Golden Hour</button>
      </div>
    </section>
    <section>
      <h2>Cover copy</h2>
      <label>Title <input id="copyTitle" type="text" value="NEON TIDE"></label>
      <label>Subtitle <input id="copySubtitle" type="text" value="chasing the last light"></label>
      <label>Tagline <input id="copyTagline" type="text" value="EVERY SUNSET HAS A PRICE"></label>
      <label>Quote <input id="copyQuote" type="text" value="A SUNSET WITH TEETH."></label>
    </section>
    <section>
      <h2>Photo</h2>
      <label class="upload">Replace selected photo
        <input id="uploadInput" type="file" accept="image/*">
      </label>
    </section>
    <section>
      <h2>Export PNG</h2>
      <div class="btnrow">
        <button type="button" id="export1080">1080 &times; 1080</button>
        <button type="button" id="export1350">1080 &times; 1350</button>
        <button type="button" id="export1920">1920 &times; 1080</button>
      </div>
    </section>
  </aside>
</main>
<script src="src/grades.js"></script>
<script src="src/cover.js"></script>
<script src="src/main.js"></script>
</body>
</html>
